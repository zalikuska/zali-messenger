# Единый Rust-кеш для всех job'ов ci.yml и build.yml.
#
# Вся логика кеша — здесь, а не в каждом job: один shared-key на раннер-ОС
# (`zali-Linux`, `zali-macOS`, `zali-Windows`), поэтому job'ы одной ОС делят
# ~/.cargo/registry и git-зависимости, а холодный job берёт кеш соседа по префиксу
# ключа вместо полной сборки с нуля. Разные наборы Cargo.lock дают разный хеш,
# так что кеши разных workspace не перезаписывают друг друга.
#
# Использование (после actions/checkout):
#   - uses: ./.github/actions/rust-cache
#     with:
#       workspaces: "core -> target"
#       key: release            # опционально: отличает варианты сборки в одной ОС
name: Rust cache (Zali)
description: Swatinem/rust-cache с общим shared-key на ОС раннера.

inputs:
  workspaces:
    description: "Список workspace для rust-cache, формат Swatinem: 'path -> target'."
    required: true
  key:
    description: "Дополнительный суффикс ключа (например, release)."
    required: false
    default: ""
  shared-key:
    description: "Переопределить общий ключ; по умолчанию zali-<ОС раннера>."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.workspaces }}
        key: ${{ inputs.key }}
        shared-key: ${{ inputs.shared-key != '' && inputs.shared-key || format('zali-{0}', runner.os) }}
