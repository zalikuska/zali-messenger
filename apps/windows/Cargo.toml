[package]
name = "zali_messenger_win"
# Cargo requires strict SemVer (MAJOR.MINOR.PATCH) here, which can't express the
# app's actual version scheme (MAJOR.MINOR{a|b|r}BUILD, e.g. "0.2b9" — see
# APP_DISPLAY_VERSION in src/native.rs, which is what the in-app updater actually
# compares against the server's app_releases.version). This field only needs to
# keep incrementing for Cargo's own bookkeeping; it is not shown to users.
version = "0.2.57"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
sha2 = "0.10"
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
wry = { version = "0.35", features = ["devtools"] }
tao = { version = "0.24", default-features = false, features = ["rwh_05"] }
zali_messenger_core = { path = "../../core" }
uuid = { version = "1.0", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
notify-rust = "4.17"
keyring = "2.3"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }
# Needed to read the window's raw HWND for the taskbar-badge overlay (see
# native/taskbar_badge.rs) — same 0.5.x already resolved transitively via tao's
# "rwh_05" feature, so this doesn't add a new version to the dependency tree.
raw-window-handle = "0.5"
muda = "0.12"
# Windows-only: system tray icon + minimize-to-tray, backing the installer's
# "launch at login" task (see apps/windows/installer/). Not used on macOS —
# the Rust shell there is the experimental, non-primary build (see CLAUDE.md)
# and already has its own quit path via the menu bar.
tray-icon = "0.19"
# Same channel type tray-icon/muda use for their global event receivers
# (TrayIconEvent::receiver()/MenuEvent::receiver()) — needed directly to select()
# over both without polling.
crossbeam-channel = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
# Те же версии, что использует wry 0.35 — новых деревьев зависимостей не добавляют.
objc = "0.2"
block = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
# Full COM bindings (unlike windows-sys, which only emits flat function/const
# declarations) — needed for the ITaskbarList3 interface behind the taskbar-badge
# overlay (native/taskbar_badge.rs). Already resolved transitively via wry/tao's
# own Win32 backend, so this pins rather than adds a new major version.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    # Нативный захват (native/media/, .claude/skills/voice-calls/native-capture.md):
    # WASAPI-микрофон и loopback, Media Foundation-камера, Windows.Graphics.Capture
    # экрана с D3D11 VideoProcessor (BGRA → NV12), WIC для превью-JPEG.
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Shell_PropertiesSystem",
] }
# Общая память WebView2 для кадров (ICoreWebView2Environment12::CreateSharedBuffer,
# ICoreWebView2_17::PostSharedBufferToScript). Ровно та версия, что тянет wry 0.35:
# её типы отдаёт `WebViewExtWindows::controller()`. Сама она построена на `windows`
# 0.52 — отсюда второй, переименованный `windows` той же версии (ComInterface::cast,
# PCWSTR); нового дерева зависимостей это не добавляет.
webview2-com = "0.28"
# `#[implement]` (IMMNotificationClient, обработчик активации process loopback)
# раскрывается в пути `::windows_core::…` — нужен прямой зависимостью; та же 0.61,
# что уже тянет `windows`.
windows-core = "0.61"
windows052 = { package = "windows", version = "0.52", features = ["Win32_Foundation"] }
# Эхо/шум/громкость микрофона (core/src/audio_processing.rs) — только Windows-сборке;
# экспериментальный macOS Rust-шелл нативный захват не делает.
zali_messenger_core = { path = "../../core", features = ["apm"] }

[build-dependencies]
serde_json = "1.0"

[dev-dependencies]
wiremock = "0.6"

# objc 0.2 macros expand `feature = "cargo-clippy"` checks; declare the value so
# rustc's unexpected_cfgs lint stays useful for our own cfgs without 7 warnings
# per build from a dependency we can't change.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(feature, values("cargo-clippy"))']
