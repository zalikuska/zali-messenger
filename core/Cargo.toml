[package]
name = "zali_messenger_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
zali_sdk = { path = "../sdk/Rust" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
subtle = "2.6"
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
jni = { version = "0.21", optional = true }
# Обработка голоса нативного захвата (src/audio_processing.rs), только macOS/Windows.
sonora = { version = "0.3", optional = true }
# Шумодав DeepFilterNet3 — форк github.com/zalikuska/dfn3_rs (NEON для aarch64, см. его NOTICE).
dfn3_rs = { git = "https://github.com/zalikuska/dfn3_rs", rev = "fb626d6d980913f167259b4273949a9d9fb6f275", optional = true }
# Нативная отправка экрана на SFU (src/sfu_publisher.rs): клиент WebRTC мимо WebView.
# Криптография — чистый Rust: одна и та же сборка для macOS, Windows и Android.
str0m = { version = "0.25", optional = true, default-features = false, features = ["rust-crypto"] }
# Буферы UDP-сокета издателя: на macOS по умолчанию ~9 КБ на отправку — ключевой кадр
# (сотни пакетов разом) терялся в ядре без единой ошибки RTP.
socket2 = { version = "0.6", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"

[dev-dependencies]
tempfile = "3.27"
# Только для examples/apm_live.rs (живой акустический тест эхоподавления).
cpal = "0.18"

[[example]]
name = "apm_live"
required-features = ["apm"]

[features]
wasm = ["wasm-bindgen", "serde-wasm-bindgen", "console_error_panic_hook"]
android = ["jni"]
# Эхо/шум/громкость для нативного захвата микрофона (macOS, Windows). Не для wasm/Android.
apm = ["sonora", "dfn3_rs"]
# Издатель экрана на SFU. Не для wasm.
sfu = ["str0m", "socket2"]

# Тесты качества APM гоняют десятки секунд звука через AEC3 — без оптимизаций
# зависимостей они идут минутами. На сборки потребителей (Windows) это не влияет:
# профили берутся только из корневого манифеста.
[profile.dev.package.sonora]
opt-level = 3
[profile.dev.package.dfn3_rs]
opt-level = 3

[[example]]
name = "sfu_pub_file"
required-features = ["sfu"]
